{% extends 'base_layout.html' %}

{% block title %}
    Play by genre
{% endblock %}

{% block content %}
    <h1>Category: genre</h1>
    <div style="text-align: center; margin-top: 100px;"> 
        <form method="post" action="{% url 'game:genre_search' %}">
            {% csrf_token %}
            <label for="submission">Enter Genre:</label><br>
            <input type="text" id="submission" name="submission" style="color: green;">
            <button type="submit" style="color: green;">Submit</button>
        </form>
    </div>
{% endblock %}
